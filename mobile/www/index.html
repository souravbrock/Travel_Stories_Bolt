<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Travel Stories</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #faf8f3; color: #334155; font-family: system-ui, sans-serif; text-align: center; }
  .card { padding: 32px; }
  h1 { color: #0f172a; font-size: 22px; margin: 12px 0 8px; }
  p { font-size: 14px; }
  button { margin-top: 16px; background: #1a6ef5; color: #fff; border: 0; border-radius: 10px;
           padding: 12px 24px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:44px">🧭</div>
    <h1>Travel Stories</h1>
    <p>No internet connection.<br />Reconnect and tap retry to explore India.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
