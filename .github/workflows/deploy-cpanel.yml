# Deploys the production build + PHP API to cPanel over FTPS on every push.
# (SSH/rsync deploys are not possible: rsync is missing on shared hosting
# and the GitHub runner cannot use the SSH key. FTPS it is.)
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_HOST      kaveri.domainadda.com
#   FTP_USERNAME  trvldeploy@reddevils.co.in (FTP account scoped to the docroot)
#   FTP_PASSWORD  the FTP account password
# The FTP account itself is created once in cPanel -> FTP Accounts
# (login trvldeploy, directory public_html/trvlstory.reddevils.co.in).

name: Deploy to cPanel

on:
  push:
    branches: [feat/all-india-states, main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble release
        run: |
          rm -rf release && mkdir -p release/api
          cp -r dist/* release/
          cp api/*.php release/api/
          cp deploy/htaccess release/.htaccess
          ls -la release release/api | head -20

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./release/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: standard

      - name: Verify live API
        run: |
          sleep 10
          curl -sf https://trvlstory.reddevils.co.in/api/health.php
          curl -sf -o /dev/null https://trvlstory.reddevils.co.in/
