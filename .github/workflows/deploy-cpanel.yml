# Deploys the production build + PHP API to cPanel over SSH on every push.
# Uses plain scp (rsync is NOT available on shared cPanel hosting).
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CPANEL_SSH_KEY  private key matching the server's authorized_keys
#                   (contents of ~/.ssh/cpanel-deploy)
#   CPANEL_HOST     kaveri.domainadda.com
#   CPANEL_USER     reddevil
#   CPANEL_DOCROOT  /home/reddevil/public_html/trvlstory.reddevils.co.in

name: Deploy to cPanel

on:
  push:
    branches: [feat/all-india-states, main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload over SSH (scp)
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          DOCROOT: ${{ secrets.CPANEL_DOCROOT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host cpanel
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF
          scp -r dist/index.html dist/assets dist/favicon.svg dist/logo.svg "cpanel:$DOCROOT/"
          scp api/*.php "cpanel:$DOCROOT/api/"
          scp deploy/htaccess "cpanel:$DOCROOT/.htaccess"

      - name: Fix permissions and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            chmod 755 ${{ secrets.CPANEL_DOCROOT }}/assets
            chmod 644 ${{ secrets.CPANEL_DOCROOT }}/assets/*
            curl -sf https://trvlstory.reddevils.co.in/api/health.php
