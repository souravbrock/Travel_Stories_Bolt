# Deploys the production build + PHP API to cPanel over SSH on every push.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CPANEL_SSH_KEY  private key matching the server's authorized_keys
#                   (contents of ~/.ssh/cpanel-deploy)
#   CPANEL_HOST     kaveri.domainadda.com
#   CPANEL_USER     reddevil
#   CPANEL_DOCROOT  /home/reddevil/public_html/trvlstory.reddevils.co.in

name: Deploy to cPanel

on:
  push:
    branches: [feat/all-india-states, main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble release
        run: |
          rm -rf release && mkdir -p release/api
          cp -r dist/* release/
          cp api/*.php release/api/
          cp deploy/htaccess release/.htaccess

      - name: Upload over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.CPANEL_HOST }}
          REMOTE_USER: ${{ secrets.CPANEL_USER }}
          TARGET: ${{ secrets.CPANEL_DOCROOT }}
          SOURCE: release/

      - name: Fix permissions and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          script: |
            chmod 755 ${{ secrets.CPANEL_DOCROOT }}/assets
            chmod 644 ${{ secrets.CPANEL_DOCROOT }}/assets/*
            curl -sf https://trvlstory.reddevils.co.in/api/health.php
